name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Compile Inno Setup Script
      uses: scottbrenner/iscc-action@v1.5.0
      with:
        filepath: setup.iss

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Complyable-Installer
        path: Output/*.exe